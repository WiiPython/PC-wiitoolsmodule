[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wiitools"
version = "0.2"
description = "PC-Implementierung des wiitools-Moduls aus dem Wii-CPython-Build"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "pygame>=2.1",
    "Pillow>=9",
    "pycurl>=7.45",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wiitools-run = "wiitools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
